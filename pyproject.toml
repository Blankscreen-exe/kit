[project]
name = "kit"
version = "0.1.0"
description = "Personal terminal toolbox: one command to list, document and run day-to-day tools."
readme = "README.md"
requires-python = ">=3.10"
# Every tool shares this one uv environment (.venv in the repo root).
# Add a package with:  uv add <package>   (run from the repo root)
dependencies = [
    # tools/md
    "markdown-it-py>=3.0",
    "mdit-py-plugins>=0.4",
    "pygments>=2.17",
    # tools/fetch, tools/port
    "psutil>=5.9",
    # tools/pomodoro, tools/top, tools/port (--live)
    "textual>=0.80",
    # tools/qr, tools/serve (via lib/kitlib/qr.py)
    "segno>=1.6",
    # tools/merge-pdf
    "pillow>=10",
    # kit core: writing the settings file (lib/kitlib/settings.py)
    "tomlkit>=0.12",
]

[tool.uv]
# kit is a collection of scripts, not an installable package
package = false
