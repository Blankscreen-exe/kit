<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kit send</title>
<style>
:root {
  --bg: #1a1918; --panel: #211f1d; --line: #3d3935; --text: #e8e3dc; --muted: #8a847c;
  --dim: #4a4642; --accent: #d97757; --good: #7fb09b; --bad: #e5857a;
}
* { box-sizing: border-box; }
body {
  margin: 0; padding: 24px; background: var(--bg); color: var(--text);
  font: 14px/1.5 ui-sans-serif, system-ui, "Segoe UI", sans-serif;
}
h1 { font-size: 15px; margin: 0 0 2px; letter-spacing: .02em; }
h1 .mark { color: var(--accent); }
.sub { color: var(--muted); margin-bottom: 18px; font-size: 13px; }
.card {
  border: 1px solid var(--line); border-radius: 10px; background: var(--panel);
  padding: 14px 16px; margin-bottom: 12px;
}
.row { display: flex; align-items: center; gap: 10px; }
.name { font-weight: 600; }
.size, .meta { color: var(--muted); font-size: 12px; }
.spacer { flex: 1; }
.link {
  display: block; width: 100%; margin-top: 10px; padding: 8px 10px; border-radius: 7px;
  border: 1px solid var(--line); background: var(--bg); color: var(--text);
  font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 12px;
}
button {
  border: 1px solid var(--line); background: var(--bg); color: var(--text); cursor: pointer;
  border-radius: 7px; padding: 7px 12px; font: inherit; font-size: 13px;
}
button:hover { border-color: var(--muted); color: #fff; }
button.primary { border-color: var(--accent); color: var(--accent); font-weight: 600; }
button.primary:hover { border-color: #f0a07e; color: #f0a07e; }
button:disabled { opacity: .45; cursor: default; }
.bar { height: 4px; border-radius: 2px; background: #2e2b28; overflow: hidden; margin-top: 8px; }
.bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
.transfer { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); font-size: 13px; }
.status { font-size: 13px; }
.status.waiting { color: var(--muted); }
.status.live { color: var(--accent); }
.status.done { color: var(--good); }
.status.dead { color: var(--bad); }
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: currentColor; margin-right: 7px; vertical-align: middle; }
footer { color: var(--dim); font-size: 12px; margin-top: 16px; }
.copied { color: var(--good); font-size: 12px; margin-left: 8px; }
</style>
</head>
<body>
<h1><span class="mark">✻</span> kit send</h1>
<div class="sub" id="head">starting…</div>
<div id="files"></div>
<div class="row">
  <button id="stop">Stop sharing</button>
  <span class="spacer"></span>
  <span class="meta" id="peer"></span>
</div>
<footer>Keep this window open while sending. Closing it ends every transfer.</footer>
<script src="./peerjs.min.js"></script>
<script src="./sender.js"></script>
</body>
</html>
