<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{{title}}</title>
<style>
:root {
  --bg: #f6f4f1; --panel: #ffffff; --line: #e2ddd6; --text: #22201e; --muted: #75706a; --accent: #c4623f;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #1a1918; --panel: #211f1d; --line: #3d3935; --text: #e8e3dc; --muted: #8a847c; --accent: #d97757; }
}
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
  background: var(--bg); color: var(--text);
  font: 15px/1.6 ui-sans-serif, system-ui, "Segoe UI", sans-serif;
}
.card {
  width: 100%; max-width: 460px; border: 1px solid var(--line); border-radius: 12px;
  background: var(--panel); padding: 22px 24px;
}
h1 { font-size: 13px; margin: 0 0 18px; color: var(--muted); font-weight: 500; letter-spacing: .04em; }
h1 .mark { color: var(--accent); }
.name { font-size: 19px; font-weight: 600; word-break: break-word; }
.detail { color: var(--muted); font-size: 14px; margin-top: 2px; }
.button {
  display: block; margin-top: 18px; padding: 11px 16px; border-radius: 8px; text-align: center;
  border: 1px solid var(--accent); color: var(--accent); font-weight: 600; text-decoration: none;
}
.button:hover { background: color-mix(in srgb, var(--accent) 10%, transparent); }
.button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.facts { color: var(--muted); font-size: 13px; margin-top: 12px; }
</style>
</head>
<body>
<main class="card">
  <h1><span class="mark">✻</span> SENT WITH KIT</h1>
  <div class="name">{{title}}</div>
  <div class="detail">{{detail}}</div>
  {{button}}
  <div class="facts">{{facts}}</div>
</main>
</body>
</html>
