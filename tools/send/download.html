<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{{title}}</title>
<!--kit-theme-->
<style>
body { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
main.slab { width: 100%; max-width: 480px; padding: 22px 24px; }
.kicker { font: 700 11px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 16px; }
.kicker .mark { color: var(--accent); margin-right: 6px; }
.name { font: 900 20px/1.25 var(--mono); word-break: break-word; }
.detail { color: var(--muted); font-size: 13px; margin-top: 4px; }
.button {
  display: block; margin-top: 20px; padding: 12px 16px; text-align: center; text-decoration: none;
  background: var(--accent); color: var(--on-accent); border: 3px solid var(--edge);
  font: 900 14px var(--mono); text-transform: uppercase; letter-spacing: .1em;
  box-shadow: 4px 4px 0 var(--shadow); transition: transform .05s, box-shadow .05s;
}
.button:hover { color: var(--on-accent); filter: brightness(1.08); }
.button:active { transform: translate(4px, 4px); box-shadow: 0 0 0 var(--shadow); }
.facts { color: var(--muted); font-size: 12px; margin-top: 14px; text-transform: uppercase; letter-spacing: .04em; }
</style>
</head>
<body>
<main class="slab">
  <div class="kicker"><span class="mark">■</span>sent with kit</div>
  <div class="name">{{title}}</div>
  <div class="detail">{{detail}}</div>
  {{button}}
  <div class="facts">{{facts}}</div>
</main>
</body>
</html>
