<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Incoming file</title>
<style>
:root {
  --bg: #1a1918; --panel: #211f1d; --line: #3d3935; --text: #e8e3dc; --muted: #8a847c;
  --accent: #d97757; --good: #7fb09b; --bad: #e5857a;
}
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
  background: var(--bg); color: var(--text);
  font: 15px/1.6 ui-sans-serif, system-ui, "Segoe UI", sans-serif;
}
.card {
  width: 100%; max-width: 460px; border: 1px solid var(--line); border-radius: 12px;
  background: var(--panel); padding: 22px 24px;
}
h1 { font-size: 14px; margin: 0 0 18px; color: var(--muted); font-weight: 500; letter-spacing: .04em; }
h1 .mark { color: var(--accent); }
.name { font-size: 19px; font-weight: 600; word-break: break-word; }
.size { color: var(--muted); font-size: 13px; margin-top: 2px; }
button {
  width: 100%; margin-top: 18px; padding: 11px 16px; border-radius: 8px; cursor: pointer;
  border: 1px solid var(--accent); background: transparent; color: var(--accent);
  font: inherit; font-weight: 600;
}
button:hover { border-color: #f0a07e; color: #f0a07e; }
button:disabled { opacity: .45; cursor: default; }
.bar { height: 5px; border-radius: 3px; background: #2e2b28; overflow: hidden; margin-top: 16px; display: none; }
.bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
.note { color: var(--muted); font-size: 13px; margin-top: 12px; }
.note.bad { color: var(--bad); }
.note.good { color: var(--good); }
.pace { font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div class="card">
  <h1><span class="mark">✻</span> SENT WITH KIT</h1>
  <div class="name" id="name">a file</div>
  <div class="size" id="size"></div>
  <button id="go">Download</button>
  <div class="bar" id="bar"><i></i></div>
  <div class="note" id="note"></div>
  <div class="note" id="how"></div>
</div>
<script src="./peerjs.min.js"></script>
<script src="./receiver.js"></script>
</body>
</html>
