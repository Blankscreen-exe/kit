<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>docker-view</title>
<!--kit-theme-->
<style>
/* The page's own names, on top of the shared Concrete palette. */
:root {
  --panel-2: var(--raised); --border: var(--edge); --accent-soft: color-mix(in srgb, var(--accent) 18%, transparent);
  --green: var(--good); --green-soft: color-mix(in srgb, var(--good) 18%, transparent);
  --amber: var(--accent); --amber-soft: color-mix(in srgb, var(--accent) 18%, transparent);
  --red: var(--bad); --red-soft: color-mix(in srgb, var(--bad) 18%, transparent);
  --grey: var(--muted); --grey-soft: color-mix(in srgb, var(--muted) 18%, transparent);
  --lift: 5px 5px 0 var(--shadow);
}
header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 3px solid var(--border); }
.topbar { max-width: 1320px; margin: 0 auto; padding: 16px 20px 12px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 10px; font: 900 20px/1.1 var(--mono); text-transform: uppercase; letter-spacing: .04em; }
.brand .mark { color: var(--accent); margin-right: -2px; }
.version { color: var(--muted); font-weight: 400; font-size: 12px; letter-spacing: .06em; }
input[type=search] { width: 280px; max-width: 100%; }
.toggle { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); font: 700 11px var(--mono); text-transform: uppercase; letter-spacing: .06em; user-select: none; white-space: nowrap; }
.updated { color: var(--muted); font-size: 11px; min-width: 120px; text-align: right; text-transform: uppercase; letter-spacing: .06em; }
nav.tabs { max-width: 1320px; margin: 0 auto; padding: 0 20px; display: flex; gap: 6px; flex-wrap: wrap; }
.tab { border: 3px solid var(--border); border-bottom: 0; box-shadow: none; background: var(--panel); color: var(--muted); padding: 7px 14px; }
.tab:hover:not(:disabled) { color: var(--text); }
.tab:active:not(:disabled) { transform: none; }
.tab.active, .tab.active:hover:not(:disabled) { background: var(--accent); color: var(--on-accent); }
.count { background: var(--raised); color: var(--text); padding: 0 6px; font-size: 11px; margin-left: 8px; }
.tab.active .count { background: var(--on-accent); color: var(--accent); }
.count:empty { display: none; }
main { max-width: 1320px; margin: 0 auto; padding: 20px; }
.banner { display: none; background: var(--red); color: var(--on-accent); border: 3px solid var(--border); padding: 10px 14px; margin-bottom: 18px; font-weight: 700; }
.banner.show { display: block; }
.group { margin-bottom: 28px; }
.group-head { display: flex; align-items: baseline; gap: 12px; margin: 0 0 10px; flex-wrap: wrap; }
.group-head h2 { font-size: 16px; font-weight: 900; margin: 0; }
.group-head h2::before { content: "\25A0  "; color: var(--accent); }
.group-head .muted { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(370px, 100%), 1fr)); gap: 14px; }
.card { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.card-top { display: flex; align-items: center; gap: 8px; min-width: 0; }
.card-top h3 { margin: 0; font-size: 14px; font-weight: 900; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card-top .service { margin-left: auto; }
.badge { white-space: nowrap; }
.badge.green { background: var(--green); border-color: var(--green); color: var(--on-accent); }
.badge.amber { background: var(--amber); border-color: var(--amber); color: var(--on-accent); }
.badge.red { background: var(--red); border-color: var(--red); color: var(--on-accent); }
.badge.grey { color: var(--grey); border-color: var(--dim); }
dl.meta { display: grid; grid-template-columns: 70px 1fr; gap: 4px 10px; font-size: 12.5px; margin: 0; color: var(--text); }
.meta dt { color: var(--muted); font: 700 11px/1.7 var(--mono); text-transform: uppercase; letter-spacing: .06em; }
.meta dd { margin: 0; overflow-wrap: anywhere; }
.mono { font-family: var(--mono); font-size: 12px; }
.muted { color: var(--muted); }
.ports { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; }
.port { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.port-link { font: 700 12px var(--mono); color: var(--accent); border: 2px solid var(--accent); padding: 0 6px; text-decoration: none; }
.port-link:hover { background: var(--accent); color: var(--on-accent); }
.port-link.non-web { color: var(--muted); border-color: var(--dim); font-weight: 400; }
.port-link.non-web:hover { background: var(--raised); color: var(--text); }
.port-target { font-size: 11.5px; }
.meter { display: inline-block; vertical-align: middle; width: 90px; height: 10px; margin-left: 8px; background: var(--bg); border: 2px solid var(--border); overflow: hidden; }
.meter > span { display: block; height: 100%; background: var(--accent); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { padding: 4px 10px; font-size: 11px; }
details.cmds summary { cursor: pointer; color: var(--muted); font: 700 11px var(--mono); text-transform: uppercase; letter-spacing: .08em; user-select: none; }
details.cmds summary:hover { color: var(--text); }
.cmd { display: flex; align-items: center; gap: 8px; background: var(--bg); border: 2px solid var(--panel-2); padding: 2px 2px 2px 10px; margin-top: 6px; }
.cmd code { flex: 1; color: var(--text); overflow-x: auto; white-space: nowrap; }
.copy { border: 0; box-shadow: none; background: none; color: var(--accent); font-size: 11px; padding: 2px 8px; }
.copy:hover:not(:disabled) { background: var(--accent); color: var(--on-accent); }
.copy:active:not(:disabled) { transform: none; }
.table-wrap { overflow-x: auto; background: var(--panel); border: 3px solid var(--border); }
th, td { padding: 9px 12px; vertical-align: top; }
td { font-size: 12px; }
tr:last-child td { border-bottom: 0; }
td .cmd { min-width: 300px; }
td .cmd:first-child { margin-top: 0; }
main .empty { padding: 40px; }
.modal-back { position: fixed; inset: 0; background: rgba(0, 0, 0, .75); display: none; align-items: center; justify-content: center; z-index: 20; padding: 20px; }
.modal-back.show { display: flex; }
.modal { background: var(--panel); border: 3px solid var(--border); width: min(1040px, 100%); max-height: 92vh; display: flex; flex-direction: column; box-shadow: var(--lift); }
.modal.small { width: min(470px, 100%); }
.modal-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 3px solid var(--border); flex-wrap: wrap; }
.modal-head h3 { margin: 0; font-size: 15px; font-weight: 900; flex: 1; min-width: 160px; overflow-wrap: anywhere; }
.modal-head h3::before { content: "\25A0  "; color: var(--accent); }
.modal-head select { padding: 3px 6px; }
.modal-body { padding: 14px 16px; overflow: auto; }
.modal-foot { display: flex; justify-content: flex-end; gap: 10px; padding: 12px 16px; border-top: 3px solid var(--border); }
pre.logs { margin: 10px 0 0; background: var(--bg); color: var(--text); border: 2px solid var(--panel-2); font-family: var(--mono); font-size: 12px; line-height: 1.45; padding: 12px; white-space: pre-wrap; overflow-wrap: anywhere; height: 62vh; overflow: auto; }
.toasts { position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 10px; z-index: 30; }
.toast { background: var(--panel); border: 3px solid var(--border); border-left: 10px solid var(--green); padding: 8px 12px; box-shadow: var(--lift); max-width: 440px; font-size: 13px; font-weight: 700; }
.toast.error { border-left-color: var(--red); }
.toast .mono { color: var(--muted); font-weight: 400; display: block; margin-top: 2px; overflow-wrap: anywhere; }
</style>
</head>
<body>
<header>
  <div class="topbar">
    <div class="brand"><span class="mark">■</span>docker-view <span class="version" id="version"></span></div>
    <div class="spacer"></div>
    <input type="search" id="filter" placeholder="Filter by name, image, project…" autocomplete="off">
    <label class="toggle"><input type="checkbox" id="auto" checked> Auto-refresh</label>
    <button class="btn" id="refresh">Refresh</button>
    <span class="updated" id="updated"></span>
  </div>
  <nav class="tabs">
    <button class="tab active" data-tab="containers">Containers<span class="count" id="count-containers"></span></button>
    <button class="tab" data-tab="images">Images<span class="count" id="count-images"></span></button>
    <button class="tab" data-tab="volumes">Volumes<span class="count" id="count-volumes"></span></button>
    <button class="tab" data-tab="networks">Networks<span class="count" id="count-networks"></span></button>
  </nav>
</header>

<main>
  <div class="banner" id="banner"></div>
  <div id="view"></div>
</main>

<div class="modal-back" id="logs-modal">
  <div class="modal">
    <div class="modal-head">
      <h3 id="logs-title">Logs</h3>
      <label class="toggle">Lines
        <select id="logs-tail"><option>100</option><option selected>300</option><option>1000</option><option>5000</option></select>
      </label>
      <label class="toggle"><input type="checkbox" id="logs-follow" checked> Follow</label>
      <button class="btn" id="logs-refresh">Refresh</button>
      <button class="btn" id="logs-close">Close</button>
    </div>
    <div class="modal-body">
      <div class="cmd"><code id="logs-cmd"></code><button class="copy" data-copy-from="logs-cmd">Copy</button></div>
      <pre class="logs" id="logs-body"></pre>
    </div>
  </div>
</div>

<div class="modal-back" id="confirm-modal">
  <div class="modal small">
    <div class="modal-head"><h3 id="confirm-title">Are you sure?</h3></div>
    <div class="modal-body">
      <p id="confirm-text" style="margin-top: 0"></p>
      <div class="cmd"><code id="confirm-cmd"></code></div>
    </div>
    <div class="modal-foot">
      <button class="btn" id="confirm-cancel">Cancel</button>
      <button class="btn primary" id="confirm-ok">Confirm</button>
    </div>
  </div>
</div>

<div class="toasts" id="toasts"></div>

<script>
"use strict";

const $ = (id) => document.getElementById(id);
const esc = (value) => String(value ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const TABS = ["containers", "images", "volumes", "networks"];

const state = {
  tab: "containers",
  containers: [], images: [], volumes: [], networks: [],
  stats: {},
  loaded: new Set(),
  openCmds: new Set(),
  filter: "",
  timer: null, statsTimer: null,
  logsTarget: null, logsTimer: null,
  confirmResolve: null,
};

// ---- api ---------------------------------------------------------------------

async function api(path, options = {}) {
  const response = await fetch(path, {
    credentials: "same-origin",
    cache: "no-store",
    ...options,
    headers: { "Content-Type": "application/json", ...(options.headers || {}) },
  });
  let body;
  try { body = await response.json(); } catch (_) { body = { error: response.statusText }; }
  if (!response.ok) throw new Error(body.error || `HTTP ${response.status}`);
  return body;
}

function showBanner(message) {
  $("banner").textContent = message || "";
  $("banner").classList.toggle("show", Boolean(message));
}

function toast(title, detail = "", isError = false) {
  const el = document.createElement("div");
  el.className = "toast" + (isError ? " error" : "");
  el.innerHTML = `${esc(title)}${detail ? `<span class="mono">${esc(detail)}</span>` : ""}`;
  $("toasts").appendChild(el);
  setTimeout(() => el.remove(), isError ? 9000 : 4500);
}

async function loadInfo() {
  try {
    const info = await api("/api/info");
    $("version").textContent = `Docker ${info.server || info.client} · ${info.os}/${info.arch}`;
  } catch (_) { /* the data loads show the banner */ }
}

async function loadTab(tab = state.tab) {
  try {
    state[tab] = (await api(`/api/${tab}`))[tab];
    state.loaded.add(tab);
    showBanner("");
    $("updated").textContent = "Updated " + new Date().toLocaleTimeString();
  } catch (err) {
    showBanner(err.message);
  }
  updateCounts();
  if (tab === state.tab) render();
}

async function loadStats() {
  if (state.tab !== "containers" || !state.containers.some((c) => c.state === "running")) return;
  try {
    state.stats = (await api("/api/stats")).stats;
    if (state.tab === "containers") render();
  } catch (_) { /* stats are optional */ }
}

// ---- rendering ---------------------------------------------------------------

function matches(...fields) {
  const needle = state.filter.trim().toLowerCase();
  return !needle || fields.join(" ").toLowerCase().includes(needle);
}

function updateCounts() {
  for (const tab of TABS) $(`count-${tab}`).textContent = state.loaded.has(tab) ? state[tab].length : "";
}

function cmdLine(command) {
  return `<div class="cmd"><code>${esc(command)}</code><button class="copy" data-copy="${esc(command)}">Copy</button></div>`;
}

function empty(total, noun) {
  return `<div class="empty">${total ? `No ${noun} match the filter.` : `No ${noun}.`}</div>`;
}

function badge(c) {
  if (c.state === "running" && c.health === "unhealthy") return ["red", "unhealthy"];
  if (c.state === "restarting") return ["amber", "restarting"];
  if (c.state === "paused") return ["amber", "paused"];
  if (c.state === "running" && c.health === "starting") return ["amber", "starting"];
  if (c.state === "running") return ["green", c.health === "healthy" ? "healthy" : "running"];
  if (c.state === "dead") return ["red", "dead"];
  return ["grey", c.state || "unknown"];
}

function shortPorts(ports) {
  const seen = [];
  for (const part of ports.split(", ")) {
    const cleaned = part.replace(/^(0\.0\.0\.0|\[::\]):/, "");
    if (cleaned && !seen.includes(cleaned)) seen.push(cleaned);
  }
  return seen.join(", ");
}

function portsCell(c) {
  const running = c.state === "running";
  const items = (c.published || []).map((p) => {
    const address = `${p.host}:${p.hostPort}`;
    const target = `<span class="muted port-target">→ ${esc(p.containerPort)}${p.service ? ` · ${esc(p.service)}` : ""}</span>`;
    if (!running) {
      return `<span class="port"><span class="mono muted" title="Start the container to open it">${esc(address)}</span>${target}</span>`;
    }
    const title = p.service
      ? `Port ${p.containerPort} is usually ${p.service}, which probably isn't a web page`
      : `Open ${p.url} in a new tab`;
    return `<span class="port"><a class="port-link${p.service ? " non-web" : ""}" href="${esc(p.url)}" target="_blank"
      rel="noopener noreferrer" title="${esc(title)}">${esc(address)} ↗</a>${target}</span>`;
  });
  // Ports that aren't published TCP ports (internal-only or UDP) can't be opened, so list them as text.
  const other = shortPorts(c.ports.split(", ").filter((part) => !part.includes("->") || !part.endsWith("/tcp")).join(", "));
  if (other) items.push(`<span class="mono muted" title="Not a published TCP port">${esc(other)}</span>`);
  return `<div class="ports">${items.join("")}</div>`;
}

function usage(c) {
  const s = state.stats[c.name];
  if (!s || c.state !== "running") return "";
  const meter = (value) => `<span class="meter"><span style="width:${Math.min(parseFloat(value) || 0, 100)}%"></span></span>`;
  return `<dt>CPU</dt><dd>${esc(s.cpu)}${meter(s.cpu)}</dd>
          <dt>Memory</dt><dd>${esc(s.mem)}${meter(s.memPerc)}</dd>`;
}

function actionButtons(c) {
  const button = (action, label, cls = "") =>
    `<button class="btn ${cls}" data-action="${action}" data-name="${esc(c.name)}">${label}</button>`;
  const out = [];
  if (c.state === "running") out.push(button("stop", "Stop"), button("restart", "Restart"), button("pause", "Pause"));
  else if (c.state === "paused") out.push(button("unpause", "Unpause", "primary"), button("stop", "Stop"));
  else if (c.state === "restarting") out.push(button("stop", "Stop"));
  else out.push(button("start", "Start", "primary"));
  out.push(`<button class="btn" data-logs="${esc(c.name)}">Logs</button>`);
  if (!["running", "paused", "restarting"].includes(c.state)) out.push(button("remove", "Remove", "danger"));
  return out.join("");
}

function containerCommands(name) {
  return [
    `docker start ${name}`, `docker stop ${name}`, `docker restart ${name}`, `docker logs -f ${name}`,
    `docker exec -it ${name} sh`, `docker inspect ${name}`, `docker rm ${name}`,
  ];
}

function card(c) {
  const [colour, label] = badge(c);
  return `<article class="card">
    <div class="card-top">
      <span class="badge ${colour}">${esc(label)}</span>
      <h3 title="${esc(c.name)}">${esc(c.name)}</h3>
      ${c.service ? `<span class="muted mono service">${esc(c.service)}</span>` : ""}
    </div>
    <dl class="meta">
      <dt>Image</dt><dd class="mono">${esc(c.image)}</dd>
      <dt>Status</dt><dd>${esc(c.status)}</dd>
      ${c.ports ? `<dt>Ports</dt><dd>${portsCell(c)}</dd>` : ""}
      ${usage(c)}
    </dl>
    <div class="actions">${actionButtons(c)}</div>
    <details class="cmds" data-name="${esc(c.name)}"${state.openCmds.has(c.name) ? " open" : ""}>
      <summary>Commands</summary>${containerCommands(c.name).map(cmdLine).join("")}
    </details>
  </article>`;
}

function renderContainers() {
  const list = state.containers.filter((c) => matches(c.name, c.image, c.project, c.service, c.status, c.ports));
  if (!list.length) return state.loaded.has("containers") ? empty(state.containers.length, "containers") : "";
  const groups = new Map();
  for (const c of list) {
    if (!groups.has(c.project)) groups.set(c.project, []);
    groups.get(c.project).push(c);
  }
  const keys = [...groups.keys()].sort((a, b) => (a === "") - (b === "") || a.localeCompare(b));
  return keys.map((key) => {
    const items = groups.get(key).sort((a, b) => a.name.localeCompare(b.name));
    const running = items.filter((c) => c.state === "running").length;
    return `<section class="group">
      <div class="group-head"><h2>${key ? esc(key) : "Standalone containers"}</h2>
        <span class="muted">${running} of ${items.length} running${key ? " · compose project" : ""}</span></div>
      <div class="cards">${items.map(card).join("")}</div>
    </section>`;
  }).join("");
}

function table(headers, rows) {
  return `<div class="table-wrap"><table><thead><tr>${headers.map((h) => `<th>${h}</th>`).join("")}</tr></thead>
    <tbody>${rows.join("")}</tbody></table></div>`;
}

function renderImages() {
  const list = state.images.filter((i) => matches(i.repository, i.tag, i.id));
  if (!list.length) return empty(state.images.length, "images");
  return table(["Repository", "Tag", "ID", "Size", "Created", "Commands"], list.map((i) => {
    const ref = i.repository === "<none>" ? i.id : `${i.repository}:${i.tag}`;
    return `<tr><td class="mono">${esc(i.repository)}</td><td class="mono">${esc(i.tag)}</td><td class="mono">${esc(i.id)}</td>
      <td>${esc(i.size)}</td><td>${esc(i.created)}</td>
      <td>${cmdLine(`docker run --rm -it ${ref} sh`)}${cmdLine(`docker rmi ${ref}`)}</td></tr>`;
  }));
}

const isAnonymous = (name) => /^[0-9a-f]{64}$/.test(name);

function volumeCard(v) {
  const anonymous = isAnonymous(v.name);
  const users = v.usedBy || [];
  const [colour, label] = users.some((u) => u.state === "running") ? ["green", "in use"]
    : users.length ? ["grey", "attached"] : ["amber", "unused"];
  const usedBy = users.length
    ? users.map((u) => `<span class="mono">${esc(u.name)}</span>${u.state === "running" ? "" : ` <span class="muted">(${esc(u.state)})</span>`}`).join("<br>")
    : '<span class="muted">No containers</span>';
  const commands = [
    `docker volume inspect ${v.name}`,
    `docker run --rm -v ${v.name}:/data alpine ls -la /data`,
    `docker volume rm ${v.name}`,
  ];
  return `<article class="card">
    <div class="card-top">
      <span class="badge ${colour}">${label}</span>
      <h3 title="${esc(v.name)}">${esc(anonymous ? v.name.slice(0, 12) + "…" : v.name)}</h3>
      ${anonymous ? '<span class="muted service">anonymous</span>' : ""}
    </div>
    <dl class="meta">
      <dt>Used by</dt><dd>${usedBy}</dd>
      <dt>Driver</dt><dd>${esc(v.driver)}</dd>
      <dt>Path</dt><dd class="mono">${esc(v.mountpoint)}</dd>
    </dl>
    <details class="cmds" data-name="volume:${esc(v.name)}"${state.openCmds.has(`volume:${v.name}`) ? " open" : ""}>
      <summary>Commands</summary>${commands.map(cmdLine).join("")}
    </details>
  </article>`;
}

function renderVolumes() {
  const list = state.volumes.filter((v) =>
    matches(v.name, v.driver, v.mountpoint, v.project, (v.usedBy || []).map((u) => u.name).join(" ")));
  if (!list.length) return empty(state.volumes.length, "volumes");
  const groups = new Map();
  for (const v of list) {
    if (!groups.has(v.project)) groups.set(v.project, []);
    groups.get(v.project).push(v);
  }
  const keys = [...groups.keys()].sort((a, b) => (a === "") - (b === "") || a.localeCompare(b));
  const namedFirst = (a, b) => isAnonymous(a.name) - isAnonymous(b.name) || a.name.localeCompare(b.name);
  return keys.map((key) => {
    const items = groups.get(key).sort(namedFirst);
    const inUse = items.filter((v) => (v.usedBy || []).some((u) => u.state === "running")).length;
    return `<section class="group">
      <div class="group-head"><h2>${key ? esc(key) : "Other volumes"}</h2>
        <span class="muted">${inUse} of ${items.length} in use${key ? " · compose project" : ""}</span></div>
      <div class="cards">${items.map(volumeCard).join("")}</div>
    </section>`;
  }).join("");
}

function renderNetworks() {
  const list = state.networks.filter((n) => matches(n.name, n.driver, n.scope, n.id));
  if (!list.length) return empty(state.networks.length, "networks");
  const builtIn = ["bridge", "host", "none"];
  return table(["Name", "Driver", "Scope", "ID", "Commands"], list.map((n) =>
    `<tr><td class="mono">${esc(n.name)}${n.internal ? ' <span class="muted">(internal)</span>' : ""}</td><td>${esc(n.driver)}</td>
      <td>${esc(n.scope)}</td><td class="mono">${esc(n.id)}</td>
      <td>${cmdLine(`docker network inspect ${n.name}`)}${builtIn.includes(n.name) ? "" : cmdLine(`docker network rm ${n.name}`)}</td></tr>`));
}

function render() {
  const views = { containers: renderContainers, images: renderImages, volumes: renderVolumes, networks: renderNetworks };
  $("view").innerHTML = views[state.tab]();
  document.querySelectorAll(".tab").forEach((t) => t.classList.toggle("active", t.dataset.tab === state.tab));
}

// ---- actions -----------------------------------------------------------------

const DOCKER_VERB = { start: "start", stop: "stop", restart: "restart", pause: "pause", unpause: "unpause", remove: "rm" };
const CONFIRMS = {
  stop: ["Stop", "Its processes are stopped. You can start it again later."],
  remove: ["Remove", "The container is deleted. Its image and named volumes are kept."],
};

function confirmDialog(title, text, command, okLabel) {
  $("confirm-title").textContent = title;
  $("confirm-text").textContent = text;
  $("confirm-cmd").textContent = command;
  $("confirm-ok").textContent = okLabel;
  $("confirm-ok").classList.toggle("danger", okLabel === "Remove");
  $("confirm-modal").classList.add("show");
  $("confirm-ok").focus();
  return new Promise((resolve) => { state.confirmResolve = resolve; });
}

function closeConfirm(result) {
  $("confirm-modal").classList.remove("show");
  if (state.confirmResolve) state.confirmResolve(result);
  state.confirmResolve = null;
}

async function runAction(action, name) {
  const command = `docker ${DOCKER_VERB[action]} ${name}`;
  if (CONFIRMS[action]) {
    const [verb, text] = CONFIRMS[action];
    if (!(await confirmDialog(`${verb} ${name}?`, text, command, verb))) return;
  }
  document.querySelectorAll(`.btn[data-name="${CSS.escape(name)}"]`).forEach((b) => { b.disabled = true; });
  try {
    const result = await api("/api/action", { method: "POST", body: JSON.stringify({ action, container: name }) });
    toast(`${action[0].toUpperCase() + action.slice(1)}: ${name}`, `ran: ${result.command}`);
  } catch (err) {
    toast(`Couldn't ${action} ${name}`, err.message, true);
  }
  await loadTab("containers");
  loadStats();
}

async function openLogs(name) {
  state.logsTarget = name;
  $("logs-title").textContent = `Logs · ${name}`;
  $("logs-body").textContent = "Loading…";
  $("logs-body").dataset.scrolled = "";
  $("logs-modal").classList.add("show");
  await refreshLogs();
  scheduleLogs();
}

async function refreshLogs() {
  const name = state.logsTarget;
  if (!name) return;
  const body = $("logs-body");
  const atBottom = body.scrollTop + body.clientHeight >= body.scrollHeight - 40;
  try {
    const data = await api(`/api/logs?container=${encodeURIComponent(name)}&tail=${$("logs-tail").value}`);
    if (state.logsTarget !== name) return;
    $("logs-cmd").textContent = data.command;
    body.textContent = data.logs || "(no output yet)";
    if (atBottom || !body.dataset.scrolled) {
      body.scrollTop = body.scrollHeight;
      body.dataset.scrolled = "yes";
    }
  } catch (err) {
    body.textContent = `Couldn't load logs: ${err.message}`;
  }
}

function scheduleLogs() {
  clearInterval(state.logsTimer);
  if ($("logs-follow").checked && state.logsTarget) state.logsTimer = setInterval(refreshLogs, 3000);
}

function closeLogs() {
  $("logs-modal").classList.remove("show");
  clearInterval(state.logsTimer);
  state.logsTarget = null;
}

async function copyText(text, button) {
  try {
    await navigator.clipboard.writeText(text);
  } catch (_) {
    const area = document.createElement("textarea");
    area.value = text;
    document.body.appendChild(area);
    area.select();
    document.execCommand("copy");
    area.remove();
  }
  const label = button.textContent;
  button.textContent = "Copied";
  setTimeout(() => { button.textContent = label; }, 1200);
}

function schedule() {
  clearInterval(state.timer);
  clearInterval(state.statsTimer);
  if (!$("auto").checked) return;
  state.timer = setInterval(() => { if (!document.hidden) loadTab(); }, 5000);
  state.statsTimer = setInterval(() => { if (!document.hidden) loadStats(); }, 10000);
}

// ---- events ------------------------------------------------------------------

// Open the tab named in the address (e.g. #volumes), so a refresh or bookmark keeps it.
const initialTab = location.hash.slice(1);
if (TABS.includes(initialTab)) state.tab = initialTab;

document.addEventListener("click", (event) => {
  const el = event.target.closest("button");
  if (!el) return;
  if (el.dataset.tab) {
    state.tab = el.dataset.tab;
    history.replaceState(null, "", `#${state.tab}`);
    render();
    loadTab().then(loadStats);
  } else if (el.dataset.action) {
    runAction(el.dataset.action, el.dataset.name);
  } else if (el.dataset.logs) {
    openLogs(el.dataset.logs);
  } else if (el.dataset.copy !== undefined) {
    copyText(el.dataset.copy, el);
  } else if (el.dataset.copyFrom) {
    copyText($(el.dataset.copyFrom).textContent, el);
  }
});

document.addEventListener("toggle", (event) => {
  const details = event.target;
  if (!details.matches || !details.matches("details.cmds")) return;
  if (details.open) state.openCmds.add(details.dataset.name);
  else state.openCmds.delete(details.dataset.name);
}, true);

document.addEventListener("keydown", (event) => {
  if (event.key !== "Escape") return;
  if ($("confirm-modal").classList.contains("show")) closeConfirm(false);
  else if ($("logs-modal").classList.contains("show")) closeLogs();
});

$("filter").addEventListener("input", (event) => { state.filter = event.target.value; render(); });
$("auto").addEventListener("change", schedule);
$("refresh").addEventListener("click", () => loadTab().then(loadStats));
$("confirm-ok").addEventListener("click", () => closeConfirm(true));
$("confirm-cancel").addEventListener("click", () => closeConfirm(false));
$("confirm-modal").addEventListener("click", (event) => { if (event.target === event.currentTarget) closeConfirm(false); });
$("logs-close").addEventListener("click", closeLogs);
$("logs-refresh").addEventListener("click", refreshLogs);
$("logs-tail").addEventListener("change", refreshLogs);
$("logs-follow").addEventListener("change", scheduleLogs);
$("logs-modal").addEventListener("click", (event) => { if (event.target === event.currentTarget) closeLogs(); });

(async function init() {
  loadInfo();
  await loadTab("containers");
  loadStats();
  for (const tab of TABS.slice(1)) loadTab(tab);
  schedule();
})();
</script>
</body>
</html>
