<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Send files</title>
<!--kit-theme-->
<style>
body { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
main.slab { width: 100%; max-width: 560px; min-width: 0; padding: 22px 24px; }
.kicker { font: 700 11px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 16px; }
.kicker .mark { color: var(--accent); margin-right: 6px; }
.name { font: 900 20px/1.25 var(--mono); word-break: break-word; }
.detail { color: var(--muted); font-size: 13px; margin-top: 6px; }
.facts { color: var(--muted); font-size: 12px; margin-top: 14px; text-transform: uppercase; letter-spacing: .04em; }
form.code { display: flex; gap: 10px; margin-top: 18px; }
form.code input { flex: 1 1 0; width: 0; min-width: 0; font: 900 22px var(--mono); letter-spacing: .2em; text-align: center; }
.drop { display: block; margin-top: 18px; cursor: pointer; }
.drop.over { border-color: var(--accent); color: var(--text); }
.drop input { display: none; }
.files { margin-top: 14px; display: grid; gap: 10px; }
.file .top { display: flex; gap: 10px; align-items: baseline; }
.file .fname { flex: 1; font-weight: 700; word-break: break-word; }
.file .fsize, .file .fstate { color: var(--muted); font-size: 12px; white-space: nowrap; }
.file .progress { margin-top: 4px; }
.file.done .fstate { color: var(--good); }
.file.bad .fstate { color: var(--bad); white-space: normal; }
.actions { display: flex; gap: 10px; margin-top: 16px; align-items: center; flex-wrap: wrap; }
.actions .primary { flex: 1; padding: 10px 16px; font-size: 14px; }
.overall { color: var(--muted); font-size: 12px; margin-top: 10px; min-height: 18px; }
.ok { color: var(--good); font: 900 16px var(--mono); margin-top: 16px; }
</style>
</head>
<body>
<main class="slab" data-code="{{code}}" data-max="{{max}}" data-chunk="{{chunk}}" data-limit="{{limit}}">
  <div class="kicker"><span class="mark">■</span>send files with kit</div>
  <div class="name">Send files</div>
  <div class="detail">They go straight to the person who sent you this link.</div>

  <section id="code-step" hidden>
    <form class="code" id="code-form" autocomplete="off">
      <input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="9" placeholder="000 000"
             aria-label="The code you were given">
      <button class="primary" type="submit">Continue</button>
    </form>
    <div class="hint">Enter the code you were given with this link.</div>
    <div class="error-text" id="code-error" hidden></div>
  </section>

  <section id="pick-step" hidden>
    <label class="drop empty" id="drop">
      <input type="file" id="picker" multiple>
      <span id="drop-text">Drop files here, or click to choose them</span>
    </label>
    <div class="files" id="files"></div>
    <div class="actions">
      <button class="primary" id="send" type="button" disabled>Send</button>
      <button class="ghost" id="clear" type="button" hidden>Clear</button>
    </div>
    <div class="overall" id="overall"></div>
    <div class="ok" id="all-done" hidden>✓ Sent. You can close this page.</div>
  </section>

  <div class="error-text" id="fatal" hidden></div>
  <div class="facts">{{facts}}</div>
</main>
<script src="upload.js"></script>
</body>
</html>
